name: Deploy Cloudflare

# Reusable Cloudflare Workers deploy with wrangler, shaped as two jobs:
#   Build -> Deploy
# Build packs the built workspace (without .git) as an artifact. Deploy ships
# exactly that artifact and is the only job that sees the Cloudflare secrets.
# Callers must use
# workflow_dispatch (manual release) and set concurrency with
# cancel-in-progress: false. Build-time public values can be passed in the
# build command from the caller, for example:
#   build: CF_WEB_ANALYTICS_TOKEN='${{ vars.CF_WEB_ANALYTICS_TOKEN }}' npm run build:cloudflare
on:
  workflow_call:
    inputs:
      runner:
        type: string
        default: instabox-medium
      timeout-minutes:
        type: number
        default: 15
      node-version:
        type: string
        default: "22"
      install:
        type: string
        default: npm ci
      build:
        description: Build command that produces the Worker assets.
        type: string
        required: true
      check:
        description: Optional package check that runs before deploy.
        type: string
        default: ""
      wrangler-version:
        type: string
        required: true
      command:
        type: string
        default: deploy
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - name: Install dependencies
        run: ${{ inputs.install }}

      - name: Build
        run: ${{ inputs.build }}

      - name: Check package
        if: inputs.check != ''
        run: ${{ inputs.check }}

      - name: Pack workspace
        run: tar --exclude=./.git -czf "$RUNNER_TEMP/workspace.tgz" .

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cloudflare-workspace
          path: ${{ runner.temp }}/workspace.tgz
          retention-days: 1
          if-no-files-found: error

  deploy:
    name: Deploy
    needs: [build]
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cloudflare-workspace
          path: ${{ runner.temp }}/artifact

      - name: Unpack workspace
        run: tar -xzf "$RUNNER_TEMP/artifact/workspace.tgz"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          package-manager-cache: false

      - name: Deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: ${{ inputs.wrangler-version }}
          command: ${{ inputs.command }}
