name: Node CI

# Reusable CI for Node projects, shaped as a job graph:
#   Install -> Lint | Typecheck | Test (parallel) -> Build
# Install warms the dependency cache; each later job restores it. Each command
# input is optional; an empty input skips its job. Build waits for the others.
# Callers own triggers, concurrency, and the group name. See docs/USAGE.md.
on:
  workflow_call:
    inputs:
      runner:
        description: Runner label. Default is the org self-hosted runner.
        type: string
        default: instabox-medium
      timeout-minutes:
        type: number
        default: 15
      node-version:
        type: string
        default: "22"
      package-manager:
        description: "npm, pnpm, or none (no install step, no cache)"
        type: string
        default: npm
      pnpm-version:
        description: Required when package-manager is pnpm.
        type: string
        default: ""
      working-directory:
        type: string
        default: "."
      install:
        description: "Install command. Empty means npm ci, or pnpm install --frozen-lockfile. Ignored when package-manager is none."
        type: string
        default: ""
      lint:
        type: string
        default: ""
      typecheck:
        type: string
        default: ""
      test:
        type: string
        default: ""
      build:
        type: string
        default: ""

permissions:
  contents: read

jobs:
  install:
    name: Install
    if: inputs.package-manager != 'none'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          # Only npm uses the setup-node cache. pnpm is installed after Node
          # and caches its store below.
          cache: ${{ inputs.package-manager == 'npm' && 'npm' || '' }}
          cache-dependency-path: ${{ inputs.package-manager == 'npm' && format('{0}/package-lock.json', inputs.working-directory) || '' }}
          package-manager-cache: ${{ inputs.package-manager == 'npm' }}

      - name: Install pnpm
        if: inputs.package-manager == 'pnpm'
        env:
          PNPM_VERSION: ${{ inputs.pnpm-version }}
        run: |
          if [ -z "$PNPM_VERSION" ]; then echo "::error::pnpm-version is required when package-manager is pnpm"; exit 1; fi
          npm install --global "pnpm@$PNPM_VERSION" --ignore-scripts

      - name: Find pnpm store
        id: pnpm-store
        if: inputs.package-manager == 'pnpm'
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        if: inputs.package-manager == 'pnpm'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ inputs.node-version }}-${{ hashFiles(format('{0}/pnpm-lock.yaml', inputs.working-directory)) }}
          restore-keys: pnpm-store-${{ runner.os }}-${{ inputs.node-version }}-

      - name: Install dependencies
        if: inputs.package-manager != 'none'
        run: ${{ inputs.install || (inputs.package-manager == 'pnpm' && 'pnpm install --frozen-lockfile' || 'npm ci') }}

  lint:
    name: Lint
    needs: [install]
    if: ${{ !cancelled() && inputs.lint != '' && needs.install.result != 'failure' }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          # Only npm uses the setup-node cache. pnpm is installed after Node
          # and caches its store below.
          cache: ${{ inputs.package-manager == 'npm' && 'npm' || '' }}
          cache-dependency-path: ${{ inputs.package-manager == 'npm' && format('{0}/package-lock.json', inputs.working-directory) || '' }}
          package-manager-cache: ${{ inputs.package-manager == 'npm' }}

      - name: Install pnpm
        if: inputs.package-manager == 'pnpm'
        env:
          PNPM_VERSION: ${{ inputs.pnpm-version }}
        run: |
          if [ -z "$PNPM_VERSION" ]; then echo "::error::pnpm-version is required when package-manager is pnpm"; exit 1; fi
          npm install --global "pnpm@$PNPM_VERSION" --ignore-scripts

      - name: Find pnpm store
        id: pnpm-store
        if: inputs.package-manager == 'pnpm'
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        if: inputs.package-manager == 'pnpm'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ inputs.node-version }}-${{ hashFiles(format('{0}/pnpm-lock.yaml', inputs.working-directory)) }}
          restore-keys: pnpm-store-${{ runner.os }}-${{ inputs.node-version }}-

      - name: Install dependencies
        if: inputs.package-manager != 'none'
        run: ${{ inputs.install || (inputs.package-manager == 'pnpm' && 'pnpm install --frozen-lockfile' || 'npm ci') }}

      - name: Lint
        run: ${{ inputs.lint }}

  typecheck:
    name: Typecheck
    needs: [install]
    if: ${{ !cancelled() && inputs.typecheck != '' && needs.install.result != 'failure' }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          # Only npm uses the setup-node cache. pnpm is installed after Node
          # and caches its store below.
          cache: ${{ inputs.package-manager == 'npm' && 'npm' || '' }}
          cache-dependency-path: ${{ inputs.package-manager == 'npm' && format('{0}/package-lock.json', inputs.working-directory) || '' }}
          package-manager-cache: ${{ inputs.package-manager == 'npm' }}

      - name: Install pnpm
        if: inputs.package-manager == 'pnpm'
        env:
          PNPM_VERSION: ${{ inputs.pnpm-version }}
        run: |
          if [ -z "$PNPM_VERSION" ]; then echo "::error::pnpm-version is required when package-manager is pnpm"; exit 1; fi
          npm install --global "pnpm@$PNPM_VERSION" --ignore-scripts

      - name: Find pnpm store
        id: pnpm-store
        if: inputs.package-manager == 'pnpm'
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        if: inputs.package-manager == 'pnpm'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ inputs.node-version }}-${{ hashFiles(format('{0}/pnpm-lock.yaml', inputs.working-directory)) }}
          restore-keys: pnpm-store-${{ runner.os }}-${{ inputs.node-version }}-

      - name: Install dependencies
        if: inputs.package-manager != 'none'
        run: ${{ inputs.install || (inputs.package-manager == 'pnpm' && 'pnpm install --frozen-lockfile' || 'npm ci') }}

      - name: Typecheck
        run: ${{ inputs.typecheck }}

  test:
    name: Test
    needs: [install]
    if: ${{ !cancelled() && inputs.test != '' && needs.install.result != 'failure' }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          # Only npm uses the setup-node cache. pnpm is installed after Node
          # and caches its store below.
          cache: ${{ inputs.package-manager == 'npm' && 'npm' || '' }}
          cache-dependency-path: ${{ inputs.package-manager == 'npm' && format('{0}/package-lock.json', inputs.working-directory) || '' }}
          package-manager-cache: ${{ inputs.package-manager == 'npm' }}

      - name: Install pnpm
        if: inputs.package-manager == 'pnpm'
        env:
          PNPM_VERSION: ${{ inputs.pnpm-version }}
        run: |
          if [ -z "$PNPM_VERSION" ]; then echo "::error::pnpm-version is required when package-manager is pnpm"; exit 1; fi
          npm install --global "pnpm@$PNPM_VERSION" --ignore-scripts

      - name: Find pnpm store
        id: pnpm-store
        if: inputs.package-manager == 'pnpm'
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        if: inputs.package-manager == 'pnpm'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ inputs.node-version }}-${{ hashFiles(format('{0}/pnpm-lock.yaml', inputs.working-directory)) }}
          restore-keys: pnpm-store-${{ runner.os }}-${{ inputs.node-version }}-

      - name: Install dependencies
        if: inputs.package-manager != 'none'
        run: ${{ inputs.install || (inputs.package-manager == 'pnpm' && 'pnpm install --frozen-lockfile' || 'npm ci') }}

      - name: Test
        run: ${{ inputs.test }}

  build:
    name: Build
    needs: [install, lint, typecheck, test]
    if: ${{ !cancelled() && inputs.build != '' && !contains(needs.*.result, 'failure') }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          # Only npm uses the setup-node cache. pnpm is installed after Node
          # and caches its store below.
          cache: ${{ inputs.package-manager == 'npm' && 'npm' || '' }}
          cache-dependency-path: ${{ inputs.package-manager == 'npm' && format('{0}/package-lock.json', inputs.working-directory) || '' }}
          package-manager-cache: ${{ inputs.package-manager == 'npm' }}

      - name: Install pnpm
        if: inputs.package-manager == 'pnpm'
        env:
          PNPM_VERSION: ${{ inputs.pnpm-version }}
        run: |
          if [ -z "$PNPM_VERSION" ]; then echo "::error::pnpm-version is required when package-manager is pnpm"; exit 1; fi
          npm install --global "pnpm@$PNPM_VERSION" --ignore-scripts

      - name: Find pnpm store
        id: pnpm-store
        if: inputs.package-manager == 'pnpm'
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        if: inputs.package-manager == 'pnpm'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ inputs.node-version }}-${{ hashFiles(format('{0}/pnpm-lock.yaml', inputs.working-directory)) }}
          restore-keys: pnpm-store-${{ runner.os }}-${{ inputs.node-version }}-

      - name: Install dependencies
        if: inputs.package-manager != 'none'
        run: ${{ inputs.install || (inputs.package-manager == 'pnpm' && 'pnpm install --frozen-lockfile' || 'npm ci') }}

      - name: Build
        run: ${{ inputs.build }}
