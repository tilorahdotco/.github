name: Security

# Reusable security checks, shaped as two parallel jobs:
#   Secret scan | Dependency audit
# The gitleaks CLI is MIT licensed; the gitleaks GitHub Action needs a paid
# license for organizations, so this workflow downloads the pinned binary.
# On pull_request it scans only the PR commits; otherwise the full history.
on:
  workflow_call:
    inputs:
      runner:
        type: string
        default: instabox-medium
      secret-scan:
        type: boolean
        default: true
      audit:
        description: "Dependency audit: npm, pnpm, or none"
        type: string
        default: npm
      pnpm-version:
        type: string
        default: ""
      node-version:
        type: string
        default: "22"
      working-directory:
        description: Directory that holds the lockfile for the audit.
        type: string
        default: "."
      audit-level:
        type: string
        default: high

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  secret-scan:
    name: Secret scan
    if: inputs.secret-scan
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          set -euo pipefail
          tgz="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          # The release download URL can return 504 for hours while the API asset URL
          # for the same file still works, so retry, then fall back to that.
          get() { curl --fail --silent --show-error --location --retry 3 --retry-all-errors --retry-delay 5 "$@"; }
          if ! get -o "$RUNNER_TEMP/$tgz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$tgz"; then
            echo "Release download failed for $tgz; trying the API asset URL" >&2
            get -o "$RUNNER_TEMP/release.json" "https://api.github.com/repos/gitleaks/gitleaks/releases/tags/v${GITLEAKS_VERSION}"
            url="$(python3 -c 'import json, sys; print(next(a["url"] for a in json.load(sys.stdin)["assets"] if a["name"] == sys.argv[1]))' "$tgz" < "$RUNNER_TEMP/release.json")"
            get -H 'Accept: application/octet-stream' -o "$RUNNER_TEMP/$tgz" "$url"
          fi
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tgz" -C "$RUNNER_TEMP" gitleaks

      - name: Scan for secrets
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          range=()
          if [ -n "$BASE_SHA" ]; then range=(--log-opts="${BASE_SHA}..${HEAD_SHA}"); fi
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --verbose "${range[@]}" .

  dependency-audit:
    name: Dependency audit
    if: inputs.audit != 'none'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          package-manager-cache: false

      - name: npm audit
        if: inputs.audit == 'npm'
        env:
          LEVEL: ${{ inputs.audit-level }}
        run: npm audit --omit=dev --audit-level="$LEVEL"

      - name: pnpm audit
        if: inputs.audit == 'pnpm'
        env:
          LEVEL: ${{ inputs.audit-level }}
          PNPM_VERSION: ${{ inputs.pnpm-version }}
        run: |
          if [ -z "$PNPM_VERSION" ]; then echo "::error::pnpm-version is required when audit is pnpm"; exit 1; fi
          npm install --global "pnpm@$PNPM_VERSION" --ignore-scripts
          pnpm audit --prod --audit-level "$LEVEL"
