name: PR-Agent review

# Reusable AI code review: PR-Agent (open source, MIT) on Claude, with no stored key.
# Each run exchanges GitHub's identity token for a 15-minute Anthropic token
# (workload identity federation). The token acts as the `pr-agents` service account
# and works only in the `pr-cicd` workspace, which has its own spend limit.
#
# The federation rule `pr-agent-org` accepts a token only when all of these hold:
#   - the repository owner is tilorahdotco (owner id 350058761);
#   - the running job is this workflow at `refs/heads/main` of this repository
#     (`job_workflow_ref`), so a copy on another branch, commit or fork gets nothing;
#   - the caller file is the repository's `.github/workflows/pr-agent.yml`;
#   - the event is `pull_request` or `issue_comment`.
# Callers must therefore use `@main`, not a commit SHA: the one exception to the
# pin rule in docs/USAGE.md. Only organization owners can push to `main` here.
# Fork PR events get no identity token and are skipped below.
#
# Callers own triggers and concurrency, and must grant `id-token: write`.
# Models (PB, 2026-11-19): reviews, automatic or `/review`, use Claude Opus 5.5 at
# high effort; the `/ask` and `/improve` comment commands use Claude Haiku 5.5 at
# medium effort. Sonnet 5.5 runs only when the chosen model fails. This workflow owns
# the model: these settings win over a `model` in a repository's `.pr_agent.toml`, which
# only adds review instructions. Other PR-Agent commands and `--config.` arguments in a
# comment are not run. See docs/USAGE.md.
on:
  workflow_call:
    inputs:
      runner:
        description: Runner label or JSON array of labels. Public repositories must use a GitHub-hosted runner (for example ubuntu-latest).
        type: string
        default: '["self-hosted", "cjbb-docker"]'
      timeout-minutes:
        type: number
        default: 15

jobs:
  review:
    name: PR-Agent
    # PR events from this repository (not forks or drafts), or a `/review`, `/ask` or
    # `/improve` comment on a PR from people with write access to it. A comment with a
    # `--config.` argument is skipped, so nobody changes the model from a comment.
    if: >-
      (github.event_name == 'pull_request'
        && github.event.pull_request.head.repo.full_name == github.repository
        && !github.event.pull_request.draft)
      || (github.event_name == 'issue_comment'
        && github.event.issue.pull_request
        && (startsWith(github.event.comment.body, '/review')
          || startsWith(github.event.comment.body, '/ask')
          || startsWith(github.event.comment.body, '/improve'))
        && !contains(github.event.comment.body, '--config.')
        && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ${{ startsWith(inputs.runner, '[') && fromJSON(inputs.runner) || inputs.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Get a short-lived Anthropic token
        env:
          RULE_ID: fdrl_01HuULKgzQTuwtQDA7Cy8xQf # pr-agent-org
          ORGANIZATION_ID: 3efd7970-54a4-4834-bde7-e84f38565f5a
          SERVICE_ACCOUNT_ID: svac_01LYi4xr4JDN5ev9mGmcouMu # pr-agents
          WORKSPACE_ID: wrkspc_01YNuFrBrkTtRpF7MFBtFqbv # pr-cicd
        run: |
          set -euo pipefail
          JWT=$(curl -fsS --max-time 30 -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.anthropic.com" | jq -r .value)
          echo "::add-mask::$JWT"
          export JWT
          if ! response=$(jq -n '{grant_type: "urn:ietf:params:oauth:grant-type:jwt-bearer",
                assertion: env.JWT, federation_rule_id: env.RULE_ID, organization_id: env.ORGANIZATION_ID,
                service_account_id: env.SERVICE_ACCOUNT_ID, workspace_id: env.WORKSPACE_ID}' \
              | curl -sS --max-time 30 https://api.anthropic.com/v1/oauth/token \
                  -H 'content-type: application/json' -d @-); then
            echo "::error::Could not reach the Anthropic token endpoint."
            exit 1
          fi
          token=$(jq -r '.access_token // empty' <<<"$response" 2>/dev/null || true)
          case "$token" in
            sk-ant-oat01-*) ;;
            *)
              # The error body holds no secret: a type and a fixed message.
              reason=$(jq -r '"\(.error.type // "unknown"): \(.error.message // "no message")"' <<<"$response" 2>/dev/null \
                || echo "the response was not JSON")
              echo "::error::The Anthropic token exchange failed ($reason). The Claude Console shows the deny reason under Workload identity, History."
              exit 1
              ;;
          esac
          echo "::add-mask::$token"
          echo "ANTHROPIC_WIF_TOKEN=$token" >> "$GITHUB_ENV"
      - name: Run PR-Agent
        # The org's wrapper action runs the PR-Agent v0.50.0 image by digest
        # (actions/pr-agent/action.yml). A direct `docker://` step fails to start in
        # repositories that allow only listed actions; an org action is always allowed.
        # After a change to the wrapper, pin its new commit here.
        uses: tilorahdotco/.github/actions/pr-agent@aa9a0efa08f43d1bce5711130246d485236bf939
        env:
          # LiteLLM sends an `sk-ant-oat` token as `Authorization: Bearer`.
          ANTHROPIC.KEY: ${{ env.ANTHROPIC_WIF_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          CONFIG.MODEL: ${{ (startsWith(github.event.comment.body, '/ask') || startsWith(github.event.comment.body, '/improve')) && 'anthropic/claude-haiku-5-5' || 'anthropic/claude-opus-5-5' }}
          CONFIG.FALLBACK_MODELS: '["anthropic/claude-sonnet-5-5"]'
          CONFIG.ENABLE_CLAUDE_ADAPTIVE_THINKING: "true"
          CONFIG.REASONING_EFFORT: ${{ (startsWith(github.event.comment.body, '/ask') || startsWith(github.event.comment.body, '/improve')) && 'medium' || 'high' }}
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "false" # the PR template is the description
          github_action_config.auto_improve: "false"
