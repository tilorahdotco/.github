name: Links

# Reusable link check with lychee. Callers own triggers (PR, push, weekly).
on:
  workflow_call:
    inputs:
      args:
        description: lychee arguments, including the file globs to check.
        type: string
        default: "--verbose --no-progress '*.html' '*.md'"
      runner:
        type: string
        default: instabox-medium
      timeout-minutes:
        type: number
        default: 10

permissions:
  contents: read

jobs:
  links:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: ${{ inputs.args }}
