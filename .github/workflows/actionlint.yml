name: actionlint

# Lints the reusable workflows in this repo. Public repo, so GitHub-hosted
# minutes are free here; the org self-hosted runner group may not serve public repos.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ACTIONLINT_VERSION: 1.7.12
  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint
        run: |
          set -euo pipefail
          tgz="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          # The release download URL can return 504 for hours while the API asset URL
          # for the same file still works, so retry, then fall back to that.
          get() { curl --fail --silent --show-error --location --retry 3 --retry-all-errors --retry-delay 5 "$@"; }
          if ! get -o "$RUNNER_TEMP/$tgz" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$tgz"; then
            echo "Release download failed for $tgz; trying the API asset URL" >&2
            get -o "$RUNNER_TEMP/release.json" "https://api.github.com/repos/rhysd/actionlint/releases/tags/v${ACTIONLINT_VERSION}"
            url="$(python3 -c 'import json, sys; print(next(a["url"] for a in json.load(sys.stdin)["assets"] if a["name"] == sys.argv[1]))' "$tgz" < "$RUNNER_TEMP/release.json")"
            get -H 'Accept: application/octet-stream' -o "$RUNNER_TEMP/$tgz" "$url"
          fi
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/$tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tgz" -C "$RUNNER_TEMP" actionlint
      - name: Lint workflows
        run: '"$RUNNER_TEMP/actionlint" -color'
